<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="wealthwarden">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Wealth Warden</title>
</head>

<body style="margin:0; padding:0; background-color:#f5f5f4;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f4;">
        <tr>
            <td align="center" style="padding:40px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
                    <tr>
                        <td style="padding:0 4px 20px; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td width="32" height="32" align="center" valign="middle" style="width:32px; height:32px; background-color:#18181b; border-radius:8px; color:#ffffff; font-size:16px; font-weight:700; line-height:32px;">W</td>
                                    <td style="padding-left:10px; color:#18181b; font-size:15px; font-weight:600;">Wealth Warden</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#ffffff; border:1px solid #e7e5e4; border-radius:12px; padding:32px; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#18181b;">
                            <h1 style="margin:0 0 16px; font-size:18px; font-weight:600; color:#18181b;">Hello {{ .subjectName }},</h1>

                            <div style="font-size:14px; line-height:1.6; color:#3f3f46;">
                                {{ template "body" . }}
                            </div>

                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
                                <tr>
                                    <td style="background-color:#18181b; border-radius:8px;">
                                        <a href="{{ .link }}" style="display:inline-block; padding:12px 20px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">{{ template "action" . }}</a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:0; font-size:13px; line-height:1.6; color:#71717a;">{{ template "footnote" . }}</p>

                            <p style="margin:24px 0 0; padding-top:16px; border-top:1px solid #e7e5e4; font-size:12px; line-height:1.6; color:#71717a; word-break:break-all;">
                                If the button does not work, paste this link into your browser:<br>
                                <a href="{{ .link }}" style="color:#3f3f46;">{{ .link }}</a>
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:20px 4px 0; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; color:#a1a1aa;">
                            &copy; {{ .year }} Wealth Warden
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
